<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HomeNest - Real Estate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>🏠 HomeNest</h2>
  <nav>
    <a href="#home">Home</a>
    <a href="#properties">Properties</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Find Your Dream Home</h1>
  <p>Buy, sell and discover beautiful properties.</p>

  <div class="search">
    <input id="search" placeholder="Search location or property...">
    <select id="type">
      <option value="all">All Types</option>
      <option value="Apartment">Apartment</option>
      <option value="Villa">Villa</option>
      <option value="House">House</option>
    </select>
    <button onclick="filterProperties()">Search</button>
  </div>
</section>

<section class="categories">
  <h2>Property Categories</h2>
  <div>
    <button onclick="showType('all')">All</button>
    <button onclick="showType('Apartment')">Apartments</button>
    <button onclick="showType('Villa')">Villas</button>
    <button onclick="showType('House')">Houses</button>
  </div>
</section>

<section id="properties">
  <h2>Featured Properties</h2>
  <div class="grid" id="propertyList"></div>
</section>

<section class="enquiry">
  <h2>Property Enquiry</h2>
  <form onsubmit="sendEnquiry(event)">
    <input placeholder="Your Name" required>
    <input type="email" placeholder="Email" required>
    <input placeholder="Phone" required>
    <textarea placeholder="Your enquiry" required></textarea>
    <button>Send Enquiry</button>
  </form>
  <p id="message"></p>
</section>

<section id="contact" class="contact">
  <h2>Contact Us</h2>
  <p>📍 Pune, Maharashtra</p>
  <p>📞 +91 98765 43210</p>
  <p>✉️ hello@homenest.com</p>
</section>

<footer>© 2026 HomeNest Real Estate</footer>

<script src="script.js"></script>
</body>
</html>
